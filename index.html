<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>독거중청년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 민원창구 번호표 — 상단 전광판 헤더 + 창구 그리드, 들어가면 창구별 업무 패널 */
:root{
  --bg:#F3F4F1; --paper:#FFFFFF; --ink:#16181D; --muted:#6B6F78; --line:#DCDED8;
  --hi:#FFD60A; --hi-ink:#16181D; --red:#E5383B; --board:#16181D; --board-fg:#FFD60A;
  --soft:#ECEDE8;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --paper:#1A1C21; --ink:#EEEEE8; --muted:#9A9DA6; --line:#2C2F36;
  --hi:#FFD60A; --hi-ink:#16181D; --red:#FF5A5F; --board:#0A0B0D; --board-fg:#FFD60A; --soft:#22252B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --paper:#1A1C21; --ink:#EEEEE8; --muted:#9A9DA6; --line:#2C2F36;
  --hi:#FFD60A; --hi-ink:#16181D; --red:#FF5A5F; --board:#0A0B0D; --board-fg:#FFD60A; --soft:#22252B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 전광판 */
.board{background:var(--board);color:var(--board-fg);border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.board .now{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;opacity:.8}
.board .num{font-family:var(--f-mono);font-weight:600;font-size:clamp(28px,6vw,44px);line-height:1;letter-spacing:.04em}
.board .msg{font-size:13px;color:#cfd2d8;max-width:46ch}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px dashed #3a3d44;margin-top:12px;padding-top:10px;width:100%;font-size:13px;color:#cfd2d8}
.ticker span{display:inline-block;padding-left:100%;animation:tick 28s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

.hero{padding-block:44px 28px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,11vw,104px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 mark{background:var(--hi);color:var(--hi-ink);padding:0 .08em}
.lead{color:var(--muted);max-width:52ch;margin:4px 0 0;font-size:16px}

/* 창구 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.win{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:grid;gap:10px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;min-width:0}
.win:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 8px 0 -2px var(--ink)}
.win .top{display:flex;justify-content:space-between;align-items:center}
.win .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.win .wait{font-family:var(--f-mono);font-size:11px;background:var(--soft);padding:2px 8px;border-radius:99px;color:var(--muted)}
.win .ico{font-size:34px;line-height:1}
.win .name{font-family:var(--f-display);font-size:28px;line-height:1.1}
.win .name small{font-size:.62em;color:var(--muted)}
.win .tag{font-size:13.5px;color:var(--muted);margin:0}
.win .go{font-family:var(--f-mono);font-size:12px;font-weight:600;border-top:1px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between}
.win .go b{background:var(--hi);color:var(--hi-ink);padding:0 6px;border-radius:4px}
.foot{margin-top:40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:grid;gap:4px}

/* 상세 */
.back{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;margin-bottom:22px}
.back:hover{border-color:var(--ink)}
.dhead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:26px}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center;min-width:110px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;background:var(--bg);border:1px solid var(--line);border-radius:50%;transform:translateY(-50%)}
.ticket::before{left:-8px}.ticket::after{right:-8px}
.ticket .l{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.ticket .n{font-family:var(--f-mono);font-weight:600;font-size:34px;line-height:1.1}
.dhead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,7vw,60px);line-height:1;margin:0}
.dhead p{margin:6px 0 0;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:baseline}
.panel h3 .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.panel .sub{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.out{background:var(--soft);border-radius:10px;padding:14px 16px;min-height:52px}
.out .big{font-family:var(--f-display);font-size:26px;line-height:1.2}
.out .s{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],input[type=date],select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type=range]{width:100%;accent-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--soft);cursor:pointer;font-size:14px}
.check input{accent-color:var(--ink);width:18px;height:18px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.food{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);text-align:left;display:grid;gap:2px}
.fcard b{font-size:15px}.fcard span{font-size:12px;color:var(--muted)}
.fcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.pair .x{font-family:var(--f-mono);color:var(--muted)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:clamp(48px,12vw,72px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .5s linear}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-mono);font-size:12px;padding:0;max-width:100%}
.cal button.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.cal button.today{border-color:var(--ink)}
.c30{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.c30 button{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-size:11px;padding:0}
.c30 button.on{background:var(--ink);color:var(--bg)}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--f-display);padding:2px 10px;transform:rotate(-6deg);border-radius:6px;font-size:18px}
.lock{border:2px dashed var(--red);border-radius:12px;padding:14px;display:grid;gap:8px}
.lock .who{font-family:var(--f-display);font-size:22px}
.warn{display:grid;gap:8px}
.warn li{background:var(--soft);border-radius:8px;padding:10px 12px}
.warn li b{color:var(--red);font-family:var(--f-mono);font-size:12px;margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;transition:transform .25s;z-index:9;max-width:calc(100% - 32px)}
.toast{opacity:0;visibility:hidden}.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media (max-width:520px){.dhead{grid-template-columns:1fr}.ticket{justify-self:start}.panels{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{padding-block:8px 22px}
.plan{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.plan .floor{fill:var(--bg)}
.plan .wall{fill:none;stroke:var(--ink);stroke-width:12;stroke-linejoin:round}
.plan .iw{stroke:var(--ink);stroke-width:6;fill:none}
.plan .win{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.plan .fx{fill:var(--soft);stroke:var(--muted);stroke-width:1.5}
.plan .door{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.plan .lbl{font:500 12px var(--f-mono);fill:var(--muted);text-anchor:middle;letter-spacing:.08em}
.obj{cursor:pointer;outline:none}
.obj .f{fill:var(--soft);stroke:var(--ink);stroke-width:2.5;transition:fill .15s}
.obj .p{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.obj .d{stroke:var(--ink);stroke-width:1.5}
.obj .t1{font:500 13px var(--f-mono);fill:var(--muted);text-anchor:middle;letter-spacing:.06em}
.obj .t2{font:400 24px var(--f-display);fill:var(--ink);text-anchor:middle}
.obj:hover .f,.obj.on .f,.obj:focus-visible .f{fill:var(--hi)}
.obj:hover .t1,.obj.on .t1,.obj:focus-visible .t1,.obj:hover .t2,.obj.on .t2,.obj:focus-visible .t2{fill:var(--hi-ink)}
.obj:focus-visible .f{stroke-width:4}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.lg{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.lg:hover,.lg.on{border-color:var(--ink)}
.lg-i{font-size:22px;line-height:1}
.lg b{display:block;font-size:14px}.lg small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ticket::before,.ticket::after{display:none}
.ticket .n.o{font-family:var(--f-display);font-weight:400;font-size:26px}
.obj{transition:transform .2s ease,filter .2s ease}
.obj:hover,.obj.on,.obj:focus-visible{transform:translateY(-6px);filter:drop-shadow(0 0 8px rgba(255,214,10,.95))}
#dude{transition:transform .45s cubic-bezier(.4,.1,.3,1)}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.cap{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:10px 8px 2px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.cap b{color:var(--ink)}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--muted)}
.pill4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pil{display:grid;justify-items:center;gap:0;background:var(--soft);border-radius:10px;padding:10px 4px}
.pil.me{box-shadow:inset 0 0 0 2px var(--ink)}
.pil .pl{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:4px}
.pil b{font-size:30px;line-height:1.1;font-weight:700}
.pil small{font-size:12px;color:var(--muted);margin-bottom:4px}
.fort{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fbox{display:grid;gap:10px;align-content:start}
.fbox .list li{display:list-item;margin-left:18px;list-style:disc}
@media (max-width:420px){.form{grid-template-columns:1fr}}
@media (max-width:640px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panels:has(#sjOut){grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:720px){.panels:has(#sjOut){grid-template-columns:1fr}}
.stage{position:relative;width:100%;aspect-ratio:4/3.1;max-width:100%;border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,var(--paper),var(--soft))}
.stage canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.bubble{position:absolute;left:50%;top:40%;transform:translate(-50%,calc(-100% - 8px));background:#FFFFFF;color:#16181D;border:1.5px solid #16181D;border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 0 rgba(22,24,29,.15)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#FFFFFF;border-right:1.5px solid #16181D;border-bottom:1.5px solid #16181D;transform:translateX(-50%) rotate(45deg)}
.nogl[hidden]{display:none}.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.plan{padding:10px}
</style>

<div class="wrap">
  <main id="home">
    <section class="hero">
      <div class="eyebrow">내 방</div>
      <h1>독거중<mark>청년</mark></h1>
      <p class="lead">방 안의 물건을 누르면 지금 상태에 맞는 기능이 열립니다.</p>
    </section>
    <div class="plan" id="plan"></div>
    <div class="legend" id="legend"></div>
    <div class="foot">
      <span>독거중청년 · 혼자 사는 청년을 위한 생활 도우미</span>
      <span>챌린지와 달력 기록은 이 브라우저에만 저장됩니다.</span>
    </div>
  </main>

  <main id="detail" hidden></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem('dg_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('dg_'+k,JSON.stringify(v))}catch(e){}}};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}

const ROOMS=[
 {id:'hungry',obj:'냉장고',no:'01',ico:'🍜',name:'배고픔',tag:'제철 음식, 페어링 술, 배달 가게 찾기',wait:'기능 3',head:'이번 달 제철 음식을 고르면 어울리는 술과 근처 배달 가게를 찾아드립니다.'},
 {id:'bored',obj:'TV',no:'02',ico:'🫠',name:'심심함',tag:'지금 할 일과 볼 작품 추천',wait:'기능 2',head:'할 일을 하나 뽑거나, 기분에 맞는 작품을 골라보세요.'},
 {id:'fat',obj:'체중계',no:'03',ico:'🏃',name:'살쪘음',tag:'홈트 루틴, 칼로리 계산, 30일 챌린지',wait:'기능 3',head:'오늘의 운동 루틴을 받고, 먹은 것을 계산하고, 30일 동안 기록하세요.'},
 {id:'broke',obj:'지갑',no:'04',ico:'🪙',name:'돈없음',tag:'무지출 달력, 예산별 레시피, 절약 다짐',wait:'기능 3',head:'돈 안 쓴 날을 기록하고, 가진 예산으로 만들 수 있는 메뉴를 찾아보세요.'},
 {id:'lazy',obj:'소파',no:'05',ico:'🛋️',name:'귀찮음',tag:'딱 한 가지, 5분 청소, 집중 타이머',wait:'기능 3',head:'오늘 할 일 하나만 정하고, 5분 청소와 25분 타이머로 시작해보세요.'},
 {id:'tired',obj:'침대',no:'06',ico:'😴',name:'피곤함',tag:'낮잠 타이머, 쉬어도 되는 이유, 스트레칭',wait:'기능 3',head:'20분 낮잠으로 회복하고 가볍게 몸을 풀어보세요.'},
 {id:'lonely',obj:'창문',no:'08',ico:'🌙',name:'고독함',tag:'사주로 보는 연애운, 결혼운',wait:'기능 2',head:'생년월일을 넣으면 사주로 연애운과 결혼운을 풀어드립니다. 재미로 봐주세요.'},
 {id:'drunk',obj:'술상',no:'07',ico:'🍺',name:'취했음',tag:'연락 잠금, 해장 메뉴, 피할 행동',wait:'기능 3',head:'연락하면 안 될 사람을 잠가두고, 내일 먹을 해장 메뉴를 정해두세요.'},
];

/* 월별 제철 음식: [음식, 설명, 페어링 술, 페어링 이유, 배달 검색어] */

/* 공용 타이머 */
function timerHTML(id,min,label){return `<div class="timer" id="${id}T">${String(min).padStart(2,'0')}:00</div><div class="bar"><i id="${id}B"></i></div>
 <div class="row" style="justify-content:center"><button class="btn y" id="${id}S">${label}</button><button class="btn ghost" id="${id}R">리셋</button></div>`}
const timers={};
function timerInit(id,min,doneMsg){
 const total=min*60;let left=total,iv=null;
 const T=$('#'+id+'T'),B=$('#'+id+'B'),S=$('#'+id+'S'),lbl=S.textContent;
 const paint=()=>{T.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;B.style.width=((total-left)/total*100)+'%'};
 const stop=()=>{clearInterval(iv);iv=null;S.textContent=lbl};
 S.onclick=()=>{if(iv){stop();S.textContent='계속';return}
  const end=Date.now()+left*1000;S.textContent='일시정지';
  iv=setInterval(()=>{left=Math.max(0,Math.round((end-Date.now())/1000));paint();if(!left){stop();toast(doneMsg);beep()}},250)};
 $('#'+id+'R').onclick=()=>{stop();left=total;paint()};
 timers[id]=stop;paint();
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.6)}catch(e){}}

const GAN='갑을병정무기경신임계',JI='자축인묘진사오미신유술해',GANH='甲乙丙丁戊己庚辛壬癸',JIH='子丑寅卯辰巳午未申酉戌亥';
const OH=['목','화','토','금','수'],OHC=['#2F9E44','#E03131','#B08900','#868E96','#1C7ED6'];
const ganEl=i=>Math.floor(i/2),jiEl=i=>[4,2,0,0,2,1,1,2,3,3,2,4][i];
const TTI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const HAP={0:1,1:0,2:11,11:2,3:10,10:3,4:9,9:4,5:8,8:5,6:7,7:6};
const SAMHAP=[[8,0,4],[11,3,7],[2,6,10],[5,9,1]];
const SIJIN=['자시 (23:30~01:29)','축시 (01:30~03:29)','인시 (03:30~05:29)','묘시 (05:30~07:29)','진시 (07:30~09:29)','사시 (09:30~11:29)','오시 (11:30~13:29)','미시 (13:30~15:29)','신시 (15:30~17:29)','유시 (17:30~19:29)','술시 (19:30~21:29)','해시 (21:30~23:29)'];
function saju(y,M,D,hb){
 let sy=(M<2||(M===2&&D<4))?y-1:y;
 const ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;
 const T=[[1,6,11],[2,4,0],[3,6,1],[4,5,2],[5,6,3],[6,6,4],[7,7,5],[8,8,6],[9,8,7],[10,8,8],[11,7,9],[12,7,10]];
 let m=10;T.forEach(t=>{if(M>t[0]||(M===t[0]&&D>=t[1]))m=t[2]});
 const ms=(((ys%5)*2+2)+m)%10,mb=(2+m)%12;
 const dn=((54+Math.round((Date.UTC(y,M-1,D)-Date.UTC(2000,0,1))/864e5))%60+60)%60;
 const ds=dn%10,db=dn%12;
 const p={y:[ys,yb],m:[ms,mb],d:[ds,db]};
 if(hb>=0)p.h=[((ds%5)*2+hb)%10,hb];
 return p;
}
const gj=(s,b)=>GAN[s]+JI[b];
function hashStr(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  $('#sjEl').innerHTML=OH.map((o,i)=>`<span class="chip" style="color:${OHC[i]}">${o} ${cnt[i]}</span>`).join('');
  const sp=sex==='m'?(dm+2)%5:(dm+3)%5,spName=sex==='m'?'재성':'관성';
  const spCnt=cnt[sp];
  const dohwa=Object.values(p).filter(c=>[0,3,6,9].includes(c[1])).length;
  const STYLE=['곧고 다정한 연애를 합니다. 상대를 챙기고 키워주는 타입이에요.','표현이 확실하고 열정적인 연애를 합니다. 시작이 빠른 만큼 꾸준함을 신경 쓰면 좋아요.','느리지만 묵직한 연애를 합니다. 신뢰가 쌓이면 오래 가요.','기준이 분명한 연애를 합니다. 아무나 만나지 않지만 한 번 정하면 확실해요.','공감을 잘하는 연애를 합니다. 생각이 많아 타이밍을 놓치지 않게 주의하세요.'];
  let love=55,lines=[];

  else if(spCnt<=2){love+=10;lines.push(`배우자를 뜻하는 ${spName}(${OH[sp]})이 ${spCnt}개 있어 인연 운이 안정적이에요. 서두르지 않아도 자연스럽게 만나는 흐름입니다.`)}

 function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);const a=w/h,v=a<1?15:12.6;cam.left=-v*a/2;cam.right=v*a/2;cam.top=v/2;cam.bottom=-v/2;cam.updateProjectionMatrix()}
 new ResizeObserver(resize).observe(stage);resize();
 const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let hov=null;
 function pick(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,cam);
  const hit=ray.intersectObjects(objs,true)[0];if(!hit)return null;let o=hit.object;while(o&&!o.userData.id)o=o.parent;return o?o.userData.id:null}
 renderer.domElement.addEventListener('pointermove',e=>{const id=pick(e);if(id!==hov){if(hov)mark(hov,false);hov=id;if(id){mark(id,true);move(id);caption(id)}renderer.domElement.style.cursor=id?'pointer':'default'}});
 renderer.domElement.addEventListener('pointerleave',()=>{if(hov)mark(hov,false);hov=null});
 renderer.domElement.addEventListener('click',e=>{const id=pick(e);if(id)go(id)});

 // 루프
 const clock=new THREE.Clock(),v3=new THREE.Vector3(),glow=new THREE.Color(0xffd60a);
 function tick(){
  requestAnimationFrame(tick);
  if($('#home').hidden)return;
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const d=v3.copy(goal).sub(pos);d.y=0;const dist=d.length();let walking=false;
  if(dist>.02){walking=true;const step=Math.min(dist,dt*4.2);pos.add(d.normalize().multiplyScalar(step));face=Math.atan2(goal.x-dude.position.x,goal.z-dude.position.z)}
  else if(arrived!==goalId){arrived=goalId;face=Math.PI/4}
  let df=face-dude.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));dude.rotation.y+=df*Math.min(1,dt*10);
  dude.position.copy(pos);
  const sw=walking?Math.sin(t*14)*.6:0;legs[0].rotation.x=sw;legs[1].rotation.x=-sw;arms[0].rotation.x=-sw*.8;arms[1].rotation.x=sw*.8;
  body.position.y=walking?Math.abs(Math.sin(t*14))*.05:(RM?0:Math.sin(t*2.4)*.015);
  objs.forEach(o=>{const on=o.userData.id===hoverId;const ty=on?.14:0;o.position.y+=(ty-o.position.y)*Math.min(1,dt*12);
   o.traverse(m=>{if(m.isMesh&&m.material.emissive&&!m.userData.keep){if(m.userData.e0===undefined){m.userData.e0=m.material.emissive.clone();m.userData.i0=m.material.emissiveIntensity}
    if(on){m.material.emissive.copy(glow);m.material.emissiveIntensity=.18}else{m.material.emissive.copy(m.userData.e0);m.material.emissiveIntensity=m.userData.i0}}})});
  renderer.render(scene,cam);
  v3.set(pos.x,2.45+body.position.y,pos.z).project(cam);
  bubble.style.left=((v3.x+1)/2*stage.clientWidth).toFixed(1)+'px';bubble.style.top=((1-v3.y)/2*stage.clientHeight).toFixed(1)+'px';
 }
 tick();
})();
function openRoom(id){
 Object.values(timers).forEach(s=>s());
 const r=ROOMS.find(x=>x.id===id);if(!r){home();return}
 const d=$('#detail');
 d.innerHTML=`<button class="back" id="back">← 방으로 돌아가기</button>
  <div class="dhead"><div class="ticket"><div class="l">방 안의 위치</div><div class="n o">${r.obj}</div></div>
  <div><h2>${r.ico} ${r.name} 청년</h2><p>${r.head}</p></div></div>
  <div class="panels">${R[id]()}</div>`;
 $('#home').hidden=true;d.hidden=false;R[id].init();
 $('#back').onclick=()=>{try{history.replaceState(null,'',location.pathname)}catch(e){}home()};
 try{history.replaceState(null,'','#'+id)}catch(e){}
 window.scrollTo({top:0});
}
function home(){Object.values(timers).forEach(s=>s());document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));$('#detail').hidden=true;$('#home').hidden=false;move('home')}
$('#home').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)go(b.dataset.id)});

if(location.hash.length>1)openRoom(location.hash.slice(1));
